name: Build Windows installer

on:
  workflow_dispatch:        # Actions tab -> "Run workflow": download the .exe from the run's artifacts
  push:
    tags: ["v*"]            # git tag v1.1.0 && git push --tags -> builds + publishes a Release

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Read version
        shell: bash
        run: echo "APPVER=$(python tools/get_version.py)" >> "$GITHUB_ENV"

      - name: Tag must match __version__
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: '[ "v$APPVER" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME != v$APPVER in main.py"; exit 1; }'

      - name: Build executable
        run: |
          pip install -r requirements.txt pyinstaller
          pyinstaller --noconfirm --clean --windowed --name IBKR-Advisor --collect-all customtkinter --collect-all yfinance --collect-submodules ib_async main.py

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc /Qp "/DAppVersion=$env:APPVER" ibkr-advisor.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: Installer-IBKR-Advisor-${{ env.APPVER }}
          path: dist/Installer-IBKR-Advisor.exe

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/Installer-IBKR-Advisor.exe
          generate_release_notes: true
